<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Clash — Live Leaderboard</title>
  <style>
    /* ── Reset & Base ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:  #ef4444;
      --blue: #3b82f6;
      --bg:   #020408;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.08);
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Arial Black', Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Background glow ─────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 15% 50%, rgba(239,68,68,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 85% 50%, rgba(59,130,246,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ──────────────────────────────────────────── */
    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 40px 0;
      gap: 20px;
    }

    header img {
      height: 52px;
      width: auto;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* ── Score board ─────────────────────────────────────── */
    .scoreboard {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0;
      padding: 28px 40px 20px;
      flex-shrink: 0;
    }

    .team-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 28px 20px;
      border-radius: 24px;
      transition: box-shadow 0.6s ease;
    }

    .team-card.red  { background: rgba(239,68,68,0.06);  border: 1px solid rgba(239,68,68,0.15); }
    .team-card.blue { background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15); }

    .team-card.red.leading  { box-shadow: 0 0 60px rgba(239,68,68,0.25);  border-color: rgba(239,68,68,0.4); }
    .team-card.blue.leading { box-shadow: 0 0 60px rgba(59,130,246,0.25); border-color: rgba(59,130,246,0.4); }

    .team-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .team-card.red  .team-label { color: var(--red); }
    .team-card.blue .team-label { color: var(--blue); }

    .team-score {
      font-size: clamp(72px, 10vw, 128px);
      font-weight: 900;
      font-style: italic;
      line-height: 1;
      letter-spacing: -0.03em;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .team-card.red  .team-score { color: var(--red); }
    .team-card.blue .team-score { color: var(--blue); }

    .team-score.bump {
      transform: scale(1.08);
    }

    .team-unit {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.3;
    }

    .team-meta {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.4;
      margin-top: 4px;
    }

    /* Centre divider */
    .vs {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 32px;
    }

    .vs-text {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      font-style: italic;
      color: rgba(255,255,255,0.12);
      letter-spacing: 0.05em;
    }

    .vs-bar {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15), transparent);
    }

    /* ── Divider ─────────────────────────────────────────── */
    .section-divider {
      position: relative;
      z-index: 1;
      margin: 0 40px;
      height: 1px;
      background: var(--border);
    }

    .section-label {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 12px 0 10px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    /* ── Feed ────────────────────────────────────────────── */
    .feed-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow: hidden;
      padding: 0 40px 32px;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 100%;
      overflow: hidden;
    }

    .feed-row {
      display: grid;
      grid-template-columns: 28px 1fr auto auto;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.4s ease;
      animation: rowIn 0.5s ease forwards;
    }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .feed-row.new-red  { border-color: rgba(239,68,68,0.3);  background: rgba(239,68,68,0.06); }
    .feed-row.new-blue { border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.06); }

    .feed-rank {
      font-size: 10px;
      font-weight: 900;
      color: rgba(255,255,255,0.2);
      text-align: center;
    }

    .feed-team-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .feed-team-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .feed-team-name.red  { color: var(--red); }
    .feed-team-name.blue { color: var(--blue); }

    .feed-time {
      font-size: 9px;
      font-weight: 700;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.1em;
    }

    .feed-score {
      font-size: 20px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.02em;
      text-align: right;
    }

    .feed-score.red  { color: var(--red); }
    .feed-score.blue { color: var(--blue); }

    .feed-score span {
      font-size: 9px;
      font-weight: 700;
      font-style: normal;
      opacity: 0.4;
      margin-left: 3px;
    }

    /* ── Empty state ─────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 40px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
      animation: blink 2s ease-in-out infinite;
    }

    /* ── Footer ──────────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 10px;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.1);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <img src="https://pub-e12eb7874b084e1da7840ee4870ec95f.r2.dev/soundclash-logo.avif" alt="Sound Clash" />
    <div class="live-badge"><div class="live-dot"></div>LIVE FEED</div>
  </header>

  <div class="scoreboard">
    <div class="team-card red" id="card-red">
      <div class="team-label">Team Red</div>
      <div class="team-score" id="score-red">0</div>
      <div class="team-unit">points</div>
      <div class="team-meta" id="count-red">0 screams</div>
    </div>

    <div class="vs">
      <div class="vs-bar"></div>
      <div class="vs-text">VS</div>
      <div class="vs-bar"></div>
    </div>

    <div class="team-card blue" id="card-blue">
      <div class="team-label">Team Blue</div>
      <div class="team-score" id="score-blue">0</div>
      <div class="team-unit">points</div>
      <div class="team-meta" id="count-blue">0 screams</div>
    </div>
  </div>

  <div class="section-divider"></div>
  <div class="section-label">Recent Screams</div>

  <div class="feed-wrap">
    <div class="feed" id="feed">
      <div class="empty" id="empty-state">AWAITING INCOMING SIGNALS...</div>
    </div>
  </div>

  <footer>SAIA SUITE 2026 &nbsp;·&nbsp; SOUND CLASH LIVE</footer>

  <script>
    // ── Config ────────────────────────────────────────────────
    const API_URL   = 'http://localhost:4000';
    const POLL_MS   = 10000;  // refresh interval
    const FEED_MAX  = 8;      // max rows shown in the feed

    // ── State ─────────────────────────────────────────────────
    let prevRedPts  = 0;
    let prevBluePts = 0;
    const renderedIds = new Set(); // IDs currently in the DOM feed

    // ── DOM refs ──────────────────────────────────────────────
    const $scoreRed  = document.getElementById('score-red');
    const $scoreBlu  = document.getElementById('score-blue');
    const $countRed  = document.getElementById('count-red');
    const $countBlu  = document.getElementById('count-blue');
    const $cardRed   = document.getElementById('card-red');
    const $cardBlu   = document.getElementById('card-blue');
    const $feed      = document.getElementById('feed');
    const $empty     = document.getElementById('empty-state');

    // ── Helpers ───────────────────────────────────────────────
    function pts(scream_time_ms) {
      // 1 point per 100ms of sustained scream
      return Math.round(scream_time_ms / 100);
    }

    function fmt(n) {
      return n.toLocaleString();
    }

    function timeAgo(isoString) {
      const d = new Date(isoString);
      const s = Math.floor((Date.now() - d.getTime()) / 1000);
      if (s < 60)  return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s/60)}m ago`;
      return `${Math.floor(s/3600)}h ago`;
    }

    function bump(el) {
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 400);
    }

    function buildRow(r, isNew) {
      const p   = pts(r.scream_time_ms);
      const sec = (r.scream_time_ms / 1000).toFixed(2);
      const row = document.createElement('div');
      row.className = `feed-row${isNew ? ` new-${r.team}` : ''}`;
      row.dataset.id = String(r.id);
      row.innerHTML = `
        <div class="feed-rank">--</div>
        <div class="feed-team-name ${r.team}">
          <div class="feed-team-dot" style="background:${r.team==='red'?'#ef4444':'#3b82f6'}"></div>
          TEAM ${r.team.toUpperCase()}
          <span class="feed-time">${timeAgo(r.created_at)}</span>
        </div>
        <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,0.25);text-align:right;letter-spacing:0.05em">${sec}s &nbsp; ${Math.round(r.peak_scream_db)}dB</div>
        <div class="feed-score ${r.team}">${fmt(p)}<span>pts</span></div>
      `;
      if (isNew) {
        // Remove highlight after 6 seconds
        setTimeout(() => row.classList.remove(`new-${r.team}`), 6000);
      }
      return row;
    }

    // ── Poll ──────────────────────────────────────────────────
    async function poll() {
      try {
        const res = await fetch(`${API_URL}/api/scores`);
        if (!res.ok) return;
        const rows = await res.json();

        // Aggregate by team
        let redPts = 0, bluePts = 0, redCount = 0, blueCount = 0;
        for (const r of rows) {
          const p = pts(r.scream_time_ms);
          if (r.team === 'red')  { redPts  += p; redCount++;  }
          if (r.team === 'blue') { bluePts += p; blueCount++; }
        }

        // Update scores + bump animation if changed
        if (redPts !== prevRedPts) {
          $scoreRed.textContent = fmt(redPts);
          bump($scoreRed);
          prevRedPts = redPts;
        }
        if (bluePts !== prevBluePts) {
          $scoreBlu.textContent = fmt(bluePts);
          bump($scoreBlu);
          prevBluePts = bluePts;
        }

        $countRed.textContent = `${redCount} scream${redCount !== 1 ? 's' : ''}`;
        $countBlu.textContent = `${blueCount} scream${blueCount !== 1 ? 's' : ''}`;

        // Leading team glow
        $cardRed.classList.toggle('leading', redPts > bluePts);
        $cardBlu.classList.toggle('leading', bluePts > redPts);

        // Feed: most recent first
        const recent = [...rows]
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
          .slice(0, FEED_MAX);

        if (recent.length === 0) {
          $empty.style.display = 'block';
          return;
        }
        $empty.style.display = 'none';

        const recentIdSet = new Set(recent.map(r => String(r.id)));

        // Remove rows that dropped off the bottom
        for (const id of [...renderedIds]) {
          if (!recentIdSet.has(id)) {
            const el = $feed.querySelector(`[data-id="${id}"]`);
            if (el) el.remove();
            renderedIds.delete(id);
          }
        }

        // Prepend only new entries (reverse so newest lands at top)
        const newEntries = recent.filter(r => !renderedIds.has(String(r.id)));
        [...newEntries].reverse().forEach(r => {
          const row = buildRow(r, true);
          const firstRow = $feed.querySelector('.feed-row');
          firstRow ? $feed.insertBefore(row, firstRow) : $feed.appendChild(row);
          renderedIds.add(String(r.id));
        });

        // Update rank numbers in place (no re-render)
        $feed.querySelectorAll('.feed-row').forEach((el, i) => {
          el.querySelector('.feed-rank').textContent = String(i + 1).padStart(2, '0');
        });

      } catch (e) {
        console.warn('[Leaderboard] Poll failed:', e.message);
      }
    }

    // ── Start ─────────────────────────────────────────────────
    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
