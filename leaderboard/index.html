<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Clash — Live Leaderboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: url('https://pub-e12eb7874b084e1da7840ee4870ec95f.r2.dev/soundclash-background-fixed.png') center center / cover no-repeat fixed;
      backdrop-filter: brightness(0.3);
      font-family: 'Arial Black', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 24px;
      gap: 12px;
      overflow-x: hidden;
    }

    /* ── Liquid glass ── */
    .glass {
      background: linear-gradient(135deg,
        rgba(255,255,255,0.28) 0%,
        rgba(255,255,255,0.10) 50%,
        rgba(255,255,255,0.20) 100%
      );
      backdrop-filter: blur(28px) saturate(180%) brightness(1.05);
      -webkit-backdrop-filter: blur(28px) saturate(180%) brightness(1.05);
      border: 1px solid rgba(255,255,255,0.55);
      border-bottom-color: rgba(255,255,255,0.18);
      border-right-color:  rgba(255,255,255,0.18);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.2),
        inset 0 1.5px 0 rgba(255,255,255,0.55);
    }

    /* ── Shared container width ── */
    .score-row, .record-card, .feed-card { width: 100%; max-width: 600px; }

    /* ── Title ── */
    .title {
      font-size: clamp(18px, 5vw, 32px);
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    /* ── Score row ── */
    .score-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .team-card {
      border-radius: 24px;
      padding: 16px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .team-label {
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }

    .team-score {
      font-size: clamp(32px, 8vw, 72px);
      font-weight: 900;
      font-style: italic;
      line-height: 1;
      letter-spacing: -0.03em;
      transition: transform 0.3s ease;
      /* shrink long numbers rather than overflow */
      width: 100%;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      /* scale down font if number is wide */
      font-size: clamp(24px, 7vw, 72px);
    }

    .team-card.red  .team-score { color: #ff6b6b; text-shadow: 0 0 20px rgba(255,80,80,0.5); }
    .team-card.blue .team-score { color: #6ba8ff; text-shadow: 0 0 20px rgba(80,140,255,0.5); }
    .team-score.bump { transform: scale(1.08); }

    .team-meta {
      font-size: clamp(8px, 2vw, 10px);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
    }

    /* ── Record cards ── */
    .record-card {
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .record-label {
      font-size: clamp(8px, 2vw, 10px);
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      text-align: center;
    }

    .record-value {
      font-size: clamp(13px, 3.5vw, 18px);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.95);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .record-value.red  { color: #ff8080; text-shadow: 0 0 12px rgba(255,80,80,0.45); }
    .record-value.blue { color: #80b4ff; text-shadow: 0 0 12px rgba(80,140,255,0.45); }

    /* ── Recent screams label ── */
    .recent-label {
      font-size: clamp(8px, 2vw, 10px);
      font-weight: 900;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
      text-align: center;
    }

    /* ── Feed card ── */
    .feed-card {
      border-radius: 24px;
      padding: 10px 14px;
      min-height: 120px;
    }

    /* Each row: rank | team+time | meta | score */
    .feed-row {
      display: grid;
      grid-template-columns: 22px 1fr auto auto;
      align-items: center;
      gap: 8px;
      padding: 9px 2px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      animation: rowIn 0.4s ease forwards;
    }

    .feed-row:last-child { border-bottom: none; }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .feed-rank {
      font-size: 9px;
      font-weight: 900;
      color: rgba(255,255,255,0.3);
      text-align: center;
      flex-shrink: 0;
    }

    /* Team name + time stacked vertically on small screens */
    .feed-team-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(9px, 2.5vw, 11px);
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      min-width: 0;
    }

    .feed-team-name.red  { color: #ff8080; }
    .feed-team-name.blue { color: #80b4ff; }

    .feed-team-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .feed-time {
      font-size: clamp(7px, 1.8vw, 9px);
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .feed-meta {
      font-size: clamp(8px, 2vw, 10px);
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      text-align: right;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }

    .feed-score {
      font-size: clamp(13px, 3.5vw, 18px);
      font-weight: 900;
      font-style: italic;
      text-align: right;
      white-space: nowrap;
    }

    .feed-score.red  { color: #ff8080; text-shadow: 0 0 8px rgba(255,80,80,0.4); }
    .feed-score.blue { color: #80b4ff; text-shadow: 0 0 8px rgba(80,140,255,0.4); }

    .feed-score span {
      font-size: 7px;
      font-style: normal;
      font-weight: 700;
      opacity: 0.45;
      margin-left: 1px;
    }

    /* hide meta column on very narrow screens */
    @media (max-width: 360px) {
      .feed-meta { display: none; }
      .feed-row  { grid-template-columns: 20px 1fr auto; }
    }

    .empty {
      text-align: center;
      padding: 32px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Live badge ── */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 16px 6px 12px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.8);
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
      animation: pulse 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }

    .live-dot.flash {
      animation: none;
      background: #fff;
      box-shadow: 0 0 10px #fff;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(34,197,94,0.7); }
      60%  { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0   rgba(34,197,94,0); }
    }
  </style>
</head>
<body>

  <img src="https://pub-e12eb7874b084e1da7840ee4870ec95f.r2.dev/soundclash-logo.avif" alt="Sound Clash" style="height:clamp(48px,10vw,80px);width:auto;filter:drop-shadow(0 4px 16px rgba(0,0,0,0.5));" />
  <div class="title">Scoreboard</div>
  <div class="live-badge glass">
    <div class="live-dot"></div>
    <span>LIVE</span>
  </div>

  <!-- Team scores -->
  <div class="score-row">
    <div class="team-card glass red" id="card-red">
      <div class="team-label">Team Red</div>
      <div class="team-score" id="score-red">0</div>
      <div class="team-meta" id="count-red">0 screams</div>
    </div>
    <div class="team-card glass blue" id="card-blue">
      <div class="team-label">Team Blue</div>
      <div class="team-score" id="score-blue">0</div>
      <div class="team-meta" id="count-blue">0 screams</div>
    </div>
  </div>

  <!-- Records -->
  <div class="record-card glass">
    <div class="record-label">High Score Record:</div>
    <div class="record-value" id="rec-high">—</div>
  </div>

  <div class="record-card glass">
    <div class="record-label">Longest Scream Record:</div>
    <div class="record-value" id="rec-longest">—</div>
  </div>

  <div class="record-card glass">
    <div class="record-label">Loudest Scream Record:</div>
    <div class="record-value" id="rec-loudest">—</div>
  </div>

  <!-- Recent screams -->
  <div class="recent-label">Recent Screams:</div>

  <div class="feed-card glass">
    <div id="feed">
      <div class="empty" id="empty-state">AWAITING INCOMING SIGNALS...</div>
    </div>
  </div>

  <script>
    // When served via the local server, use relative URL. Fallback for direct file open.
    const API_URL  = location.protocol === 'file:' ? 'http://localhost:4001' : '';
    const POLL_MS  = 10000;
    const FEED_MAX = 8;

    let prevRedPts  = 0;
    let prevBluePts = 0;
    const renderedIds = new Set();
    const $liveDot   = document.querySelector('.live-dot');

    // ── Password Management ────────────────────────────────────────────────
    function getPassword() {
      let pw = sessionStorage.getItem('leaderboard_pw');
      if (!pw) {
        pw = prompt('Enter Leaderboard Password:');
        if (pw) sessionStorage.setItem('leaderboard_pw', pw);
      }
      return pw;
    }

    function flashLive() {
      $liveDot.classList.add('flash');
      setTimeout(() => $liveDot.classList.remove('flash'), 400);
    }

    const $scoreRed  = document.getElementById('score-red');
    const $scoreBlu  = document.getElementById('score-blue');
    const $countRed  = document.getElementById('count-red');
    const $countBlu  = document.getElementById('count-blue');
    const $cardRed   = document.getElementById('card-red');
    const $cardBlu   = document.getElementById('card-blue');
    const $feed      = document.getElementById('feed');
    const $empty     = document.getElementById('empty-state');
    const $recHigh   = document.getElementById('rec-high');
    const $recLong   = document.getElementById('rec-longest');
    const $recLoud   = document.getElementById('rec-loudest');

    function fmt(n)  { return Number(n).toLocaleString(); }

    function timeAgo(iso) {
      const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60)   return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s/60)}m ago`;
      return `${Math.floor(s/3600)}h ago`;
    }

    function bump(el) {
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 400);
    }

    function teamColor(team) { return team === 'red' ? '#ff6060' : '#6090ff'; }

    function buildRow(r) {
      const sec = (r.scream_time_ms / 1000).toFixed(2);
      const row = document.createElement('div');
      row.className = 'feed-row';
      row.dataset.id = String(r.id);
      row.innerHTML = `
        <div class="feed-rank">--</div>
        <div class="feed-team-name ${r.team}">
          <div class="feed-team-dot" style="background:${teamColor(r.team)}"></div>
          TEAM ${r.team.toUpperCase()}
          <span class="feed-time">${timeAgo(r.created_at)}</span>
        </div>
        <div class="feed-meta">${sec}s &nbsp; ${Math.round(r.peak_scream_db)}dB</div>
        <div class="feed-score ${r.team}">${fmt(r.final_score)}<span>pts</span></div>
      `;
      return row;
    }

    async function poll() {
      const pw = getPassword();
      if (!pw) return;

      try {
        const res = await fetch(`${API_URL}/api/scores`, {
          headers: { 'x-api-password': pw }
        });

        if (res.status === 401) {
          sessionStorage.removeItem('leaderboard_pw');
          return poll(); // Re-prompt
        }

        if (!res.ok) return;
        const rows = await res.json();

        let redPts = 0, bluePts = 0, redCount = 0, blueCount = 0;
        let highScoreRow = null, longestRow = null, loudestRow = null;

        for (const r of rows) {
          if (r.team === 'red')  { redPts  += r.final_score; redCount++;  }
          if (r.team === 'blue') { bluePts += r.final_score; blueCount++; }

          if (!highScoreRow || r.final_score > highScoreRow.final_score) highScoreRow = r;
          if (!longestRow  || r.scream_time_ms > longestRow.scream_time_ms) longestRow = r;
          if (!loudestRow  || r.peak_scream_db > loudestRow.peak_scream_db) loudestRow = r;
        }

        if (redPts !== prevRedPts)  { $scoreRed.textContent = fmt(redPts);  bump($scoreRed);  prevRedPts  = redPts;  }
        if (bluePts !== prevBluePts){ $scoreBlu.textContent = fmt(bluePts); bump($scoreBlu); prevBluePts = bluePts; }

        $countRed.textContent = `${redCount} scream${redCount !== 1 ? 's' : ''}`;
        $countBlu.textContent = `${blueCount} scream${blueCount !== 1 ? 's' : ''}`;

        // Records
        if (highScoreRow) {
          $recHigh.textContent = `${fmt(highScoreRow.final_score)} pts — Team ${highScoreRow.team.toUpperCase()}`;
          $recHigh.className = `record-value ${highScoreRow.team}`;
        }
        if (longestRow) {
          $recLong.textContent = `${(longestRow.scream_time_ms/1000).toFixed(2)}s — Team ${longestRow.team.toUpperCase()}`;
          $recLong.className = `record-value ${longestRow.team}`;
        }
        if (loudestRow) {
          $recLoud.textContent = `${Math.round(loudestRow.peak_scream_db)}dB — Team ${loudestRow.team.toUpperCase()}`;
          $recLoud.className = `record-value ${loudestRow.team}`;
        }

        const recent = [...rows]
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
          .slice(0, FEED_MAX);

        if (recent.length === 0) { $empty.style.display = 'block'; return; }
        $empty.style.display = 'none';

        const recentIdSet = new Set(recent.map(r => String(r.id)));

        for (const id of [...renderedIds]) {
          if (!recentIdSet.has(id)) {
            const el = $feed.querySelector(`[data-id="${id}"]`);
            if (el) el.remove();
            renderedIds.delete(id);
          }
        }

        const newEntries = recent.filter(r => !renderedIds.has(String(r.id)));
        [...newEntries].reverse().forEach(r => {
          const row = buildRow(r);
          const first = $feed.querySelector('.feed-row');
          first ? $feed.insertBefore(row, first) : $feed.appendChild(row);
          renderedIds.add(String(r.id));
        });

        $feed.querySelectorAll('.feed-row').forEach((el, i) => {
          el.querySelector('.feed-rank').textContent = String(i + 1).padStart(2, '0');
        });

        flashLive();
      } catch (e) {
        console.warn('[Leaderboard] Poll failed:', e.message);
      }
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
